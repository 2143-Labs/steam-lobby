[package]
name = "lobby-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["sync"] }
skillratings = "0.29"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
