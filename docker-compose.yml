services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lobby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (openssl rand -base64 24)}
      POSTGRES_DB: ${POSTGRES_DB:-lobby}
    # No ports: the DB is only reachable inside the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lobby}"]
      interval: 2s
      timeout: 3s
      retries: 10

  lobby:
    build: .
    ports:
      - "8080:8080"
    environment:
      # NOTE: POSTGRES_PASSWORD is interpolated into DATABASE_URL, so it must be
      # URL-safe (alphanumeric or base64). `openssl rand -base64 24` output works.
      DATABASE_URL: postgres://${POSTGRES_USER:-lobby}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lobby}
      # STEAM_API_KEY intentionally NOT set — OpenID login needs no key; add it
      # explicitly (real Steam Web API key) only when ticket auth is required.
      STEAM_APP_ID: ${STEAM_APP_ID:-480}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (openssl rand -base64 48)}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      JWT_TTL_S: ${JWT_TTL_S:-86400}
      RUST_LOG: ${RUST_LOG:-info,lobby_server=debug}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-http://localhost:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-lobby}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
