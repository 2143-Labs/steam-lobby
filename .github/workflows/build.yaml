name: server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  registry: ghcr.io/2143-labs
  repo: steam-lobby

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Docker login
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: "${{ env.registry }}/${{ env.repo }}:${{ github.run_number }}"
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set image tag output
      id: meta
      run: echo "version=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  update-argo:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ !contains(github.event.head_commit.message, '[direct-prod]') && 'production' || '' }}
    env:
      NEW_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: 2143-Labs/argo
        ssh-key: ${{ secrets.DEPLOY_KEY_ARGO }}

    - name: Update image tag in deployment YAML
      run: |
        sed -i "s|\(ghcr\.io/2143-labs/steam-lobby:\)[0-9]*|\1${{ env.NEW_TAG }}|g" workloads/steam-lobby/deployment.yaml
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --quiet && echo "No changes" || (git commit -am "bump steam-lobby image to ${{ env.NEW_TAG }}" && git push)
