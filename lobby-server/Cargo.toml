[package]
name = "lobby-server"
version = "0.1.0"
edition = "2024"

[dependencies]
lobby-core = { path = "../lobby-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = "1"
serde_json = "1"
dotenvy = "0.15"
uuid = "1"
url = "2"
parking_lot = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
temporalio-sdk = "=0.6.0"
temporalio-client = "=0.6.0"
temporalio-macros = "=0.6.0"
temporalio-workflow = "=0.6.0"
temporalio-common = "=0.6.0"
futures = "0.3"
anyhow = "1"

[dev-dependencies]
lobby-client = { path = "../lobby-client" }
tokio = { version = "1", features = ["full", "macros"] }

tokio-tungstenite = "0.29"