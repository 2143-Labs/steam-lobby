[package]
name = "lobby-client"
version = "0.1.0"
edition = "2021"

[dependencies]
lobby-core = { path = "../lobby-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
url = "2"
